<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MARQUEE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  ==========================================================================
  MARQUEE — the picture house.

  Reads manifest.js (generated by tools/derive.js) and nothing else. This page
  holds NO list of works and must never grow one, not even as a fallback for a
  missing manifest: the whole architecture is that the catalog is derived, and
  a hardcoded list here would be a second catalog drifting quietly behind the
  first. With no manifest it says so and shows nothing.

  THE CONCEIT. A single-screen neighbourhood cinema, a couple of decades past
  its best. It is a theatre rather than an arcade because the vocabulary got
  there first — feature presentation, sneak preview, side stage, art house —
  and fighting that would have cost more than it bought.

  THE POSTERS ARE DERIVED, NOT DRAWN. There is no artwork for any of these
  works and inventing some would break a rule that matters: Games/CLAUDE.md
  says games are stylistically independent on purpose and a look must never be
  carried from one into another. So a poster is not a claim about how a game
  looks. It is the HOUSE's printing — one grid, one type treatment, eight
  faded offset-ink palettes, picked deterministically from a hash of the
  work's own folder name. Same input, same poster, forever, with no assets and
  no latency. The cinema prints its own programme; it does not speak for the
  film.

  WHAT CHANGED IN THIS PASS: presentation only. Every class name the smoke
  suite depends on (.card, .card.inert, .roomname, details.drift) survived
  deliberately, so tools/smoke.js passes unmodified — which is the evidence
  that the skin and the machinery really were separable, as promised before
  either was built.

  file:// constraints this page is built around, all measured rather than
  assumed (17 Aug 2026, headless Chrome):
    - iframes of file:// DO load from a file:// parent.
    - The parent CANNOT script into them (contentDocument is null; both sides
      are opaque origin "null"). Once a work has focus this page stops hearing
      the keyboard AND the mouse, which is why the bezel carries a visible
      button and folds rather than hiding.
    - localStorage is NOT partitioned for the frame: a framed work reads the
      same saves as a double-clicked one. Nobody's high scores are orphaned.

  CTown-4 (Opus 5), 17 Aug 2026.
  ==========================================================================
-->
<style>
  /* ===== tunables, kept together ====================================== */
  :root{
    --night:#0a0910;         /* the street outside */
    --night-2:#121019;
    --brick:#171320;
    --line:#2b2536;
    --text:#ece6db;
    --text-dim:#9d95a6;
    --text-faint:#6a6375;

    --bulb:#ffcf7a;
    --bulb-hot:#ff9c2e;
    --neon:#ff5f6d;
    --warn:#e0a33c;

    --board:#141018;         /* the reader board panel */
    --board-letter:#f2ead8;

    --card-w:210px;
    --bezel:46px;
    --paper-grain:.045;      /* how visible the offset speckle is */
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255,156,46,.09), transparent 60%),
      var(--night);
    color:var(--text);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    overflow-y:scroll;
  }

  /* ===== THE FACADE =================================================== */
  /* A projecting marquee sign over the entrance. Bulbs along the top and
     bottom edges, the house name in the middle, and a changeable-letter
     reader board underneath saying what is on. */
  header{
    position:relative;
    padding:26px 20px 0;
    background:linear-gradient(180deg,#100d17,var(--night) 70%);
    border-bottom:1px solid var(--line);
  }
  .sign{
    max-width:1180px;margin:0 auto;
    background:linear-gradient(180deg,#1d1826,#15111d);
    border:1px solid #37304a;
    border-radius:4px 4px 2px 2px;
    box-shadow:0 14px 44px rgba(255,156,46,.10), inset 0 1px 0 rgba(255,255,255,.05);
    padding:12px 0 0;
  }
  .bulbs{display:flex;justify-content:center;gap:0;padding:0 12px}
  .bulbs i{
    flex:1 1 auto;max-width:16px;height:7px;
    display:block;position:relative;
  }
  .bulbs i::after{
    content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);
    width:6px;height:6px;border-radius:50%;
    background:var(--bulb);
    box-shadow:0 0 6px var(--bulb-hot),0 0 15px rgba(255,156,46,.5);
    animation:chase 1.9s linear infinite;
  }
  /* Two bulbs are out, and they stay out. A marquee with every bulb lit is a
     rendering, not a sign. */
  .bulbs i.dead::after{background:#3b3342;box-shadow:none;animation:none;opacity:.6}
  @keyframes chase{0%,70%{opacity:1}80%{opacity:.35}90%{opacity:1}}
  .bulbs i:nth-child(3n)::after{animation-delay:.63s}
  .bulbs i:nth-child(3n+1)::after{animation-delay:1.26s}

  .housename{
    text-align:center;margin:14px 0 12px;
    font-size:clamp(30px,6vw,58px);line-height:1;font-weight:800;
    letter-spacing:.30em;text-indent:.30em;
    color:#fff3dc;
    text-shadow:0 0 10px rgba(255,190,110,.55),0 0 34px rgba(255,120,40,.35);
  }

  /* The reader board — individual plastic letters slotted into rails. Every
     real one has a crooked letter, so a deterministic few are tilted. */
  .board{
    background:var(--board);
    border-top:1px solid #37304a;
    padding:11px 14px 13px;
    min-height:52px;
    display:flex;align-items:center;justify-content:center;flex-wrap:wrap;
    gap:1px;
    box-shadow:inset 0 3px 12px rgba(0,0,0,.7);
  }
  .board span{
    font:600 clamp(11px,1.5vw,15px)/1 "Consolas",ui-monospace,monospace;
    letter-spacing:.06em;color:var(--board-letter);
    padding:2px 1px;display:inline-block;
    transition:transform .2s ease;
  }
  .board span.sp{width:.5em}
  .board span.tilt{transform:rotate(-4deg) translateY(1px)}
  .board span.tilt2{transform:rotate(3deg) translateY(-1px)}
  .board.dim span{color:var(--text-faint)}

  .boxoffice{
    max-width:1180px;margin:0 auto;
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;
    padding:16px 4px 18px;
  }
  #q{
    background:#100d17;border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:2px;width:250px;font:inherit;
  }
  #q:focus{outline:none;border-color:var(--bulb);box-shadow:0 0 0 3px rgba(255,207,122,.10)}
  .count{color:var(--text-faint);font-size:12px}
  kbd{
    background:#100d17;border:1px solid var(--line);border-radius:2px;
    padding:1px 5px;font:11px Consolas,monospace;color:var(--text-dim);
  }

  /* ===== THE DOORS ==================================================== */
  /* Rooms are walked between rather than scrolled past. One room is open at a
     time; typing in the filter box temporarily opens the whole building,
     because a directory search that only looks in the room you happen to be
     standing in is a worse search. */
  .doors{
    max-width:1180px;margin:0 auto;padding:0 4px 18px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;
  }
  .door{
    position:relative;background:#15111d;border:1px solid var(--line);
    border-bottom-width:3px;border-radius:3px 3px 1px 1px;
    color:var(--text-dim);font:inherit;cursor:pointer;
    padding:9px 15px 8px;text-align:left;min-width:104px;
    transition:background .15s,border-color .15s,color .15s,transform .12s;
  }
  .door b{display:block;font-size:11.5px;letter-spacing:.15em;text-transform:uppercase;font-weight:700}
  .door i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.1em;color:var(--text-faint);margin-top:3px}
  .door:hover{color:var(--text);border-color:#4a4160;transform:translateY(-1px)}
  .door.here{
    background:linear-gradient(180deg,#241d33,#181324);
    color:var(--bulb);border-color:var(--bulb);
    box-shadow:0 0 20px rgba(255,156,46,.14);
  }
  .door.here i{color:var(--text-dim)}
  /* The lamp above an open door. */
  .door.here::before{
    content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--bulb);
    box-shadow:0 0 7px var(--bulb-hot);
  }
  .doors.searching .door{opacity:.4}
  .doors.searching .door.here{opacity:.55}
  .searchnote{
    align-self:center;color:var(--bulb);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;padding-left:4px;
  }

  /* ===== THE LOBBY ==================================================== */
  main{max-width:1180px;margin:0 auto;padding:30px 20px 70px}

  .room{margin-bottom:52px}
  .roomname{
    display:flex;align-items:baseline;gap:14px;
    font-size:13px;letter-spacing:.30em;text-transform:uppercase;font-weight:700;
    color:var(--text-dim);padding-bottom:9px;margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  .roomname i{font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--text-faint)}
  .room.primary .roomname{color:var(--bulb);font-size:15px}
  .roommissing{
    border:1px solid var(--warn);border-radius:3px;padding:12px 14px;
    color:var(--warn);font-size:12.5px;margin-bottom:24px;
  }

  h2.sec{
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--text-faint);
    margin:0 0 14px;font-weight:700;
    padding-bottom:7px;border-bottom:1px solid var(--line);
  }
  .sec-wrap + .sec-wrap{margin-top:38px}
  .room > .grid + .sec-wrap{margin-top:38px}

  .grid{
    display:grid;gap:16px;
    grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));
    align-items:start;
  }

  /* ===== THE POSTERS ================================================== */
  /* Eight offset-ink palettes. Which one a work gets is a pure function of
     its folder name, so a poster never changes between runs and nothing has
     to be stored. */
  .card{
    --paper:#e8dcc0; --ink:#2a2119; --accent:#b03a24;
    position:relative;overflow:hidden;
    background:var(--paper);color:var(--ink);
    border:0;border-radius:2px;padding:0;
    text-align:left;font:inherit;cursor:pointer;
    display:flex;flex-direction:column;
    aspect-ratio:4/5;
    box-shadow:0 2px 0 rgba(0,0,0,.5),0 10px 22px rgba(0,0,0,.45);
    transition:transform .16s ease,box-shadow .16s ease;
  }
  .card.ink1{--paper:#dfe6e2;--ink:#14211f;--accent:#1f7a6b}
  .card.ink2{--paper:#efe3e6;--ink:#241a1d;--accent:#8c2f45}
  .card.ink3{--paper:#e9e4d4;--ink:#1e2430;--accent:#c8791f}
  .card.ink4{--paper:#dce3ee;--ink:#161d2b;--accent:#2f4fa0}
  .card.ink5{--paper:#e6e8dd;--ink:#1f2418;--accent:#5c7a3a}
  .card.ink6{--paper:#f0e6da;--ink:#2b1f16;--accent:#a85327}
  .card.ink7{--paper:#e3dfe8;--ink:#201c28;--accent:#5b3f8c}

  /* Cheap offset printing: visible speckle and a slightly uneven ink lay. */
  .card::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,var(--paper-grain)) 1px, transparent 1.4px),
      radial-gradient(circle at 70% 65%, rgba(0,0,0,var(--paper-grain)) 1px, transparent 1.4px),
      radial-gradient(circle at 45% 85%, rgba(0,0,0,var(--paper-grain)) 1px, transparent 1.4px);
    background-size:13px 13px,17px 17px,23px 23px;
    mix-blend-mode:multiply;
  }
  /* Age: light foxing in one corner, and the paper is never perfectly white. */
  .card::after{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(120% 90% at 108% -8%, rgba(120,80,20,.20), transparent 55%);
  }

  .card:hover,.card:focus-visible{
    outline:none;transform:translateY(-4px) rotate(-.35deg);
    box-shadow:0 3px 0 rgba(0,0,0,.5),0 16px 34px rgba(0,0,0,.6),0 0 0 2px var(--bulb);
  }

  .poster{position:relative;z-index:3;pointer-events:none;display:flex;flex-direction:column;height:100%;padding:14px 13px 11px}

  .ptop{font:700 8.5px/1 "Segoe UI",sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:.62}

  .ptitle{
    margin-top:9px;
    font-weight:800;line-height:.95;letter-spacing:-.005em;
    text-transform:uppercase;
    word-break:break-word;hyphens:auto;
    font-size:clamp(17px,2.1vw,25px);
  }
  /* Layout variants, also chosen by the hash, so the wall of posters is not
     34 copies of one design. */
  .card.v1 .ptitle{font-style:italic;letter-spacing:.01em}
  .card.v2 .ptitle{font-size:clamp(15px,1.8vw,21px);letter-spacing:.10em}
  .card.v3 .ptitle{color:var(--accent)}
  .card.v4 .ptitle{font-size:clamp(19px,2.4vw,29px);line-height:.88}
  .card.v2 .poster{padding-top:20px}

  .prule{height:2px;background:var(--ink);opacity:.75;margin:10px 0 9px}
  .card.v3 .prule{background:var(--accent);height:3px}

  .ptag{
    font-size:10.5px;line-height:1.42;opacity:.82;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  }

  /* The printer's device. Sits under the type, bleeding off the lower corner,
     so a sheet with a two-line tagline still reads as a printed object rather
     than as a card with a gap in it. */
  .pmark{
    position:absolute;z-index:0;right:-.08em;bottom:-.30em;
    font:800 128px/1 "Segoe UI",system-ui,sans-serif;
    color:var(--accent);opacity:.16;pointer-events:none;user-select:none;
  }
  .card.v1 .pmark{font-style:italic}
  .card.v3 .pmark{opacity:.22}
  .card.v4 .pmark{left:-.10em;right:auto;opacity:.13}
  .sec-feature .pmark{font-size:178px}
  .pfoot{
    margin-top:auto;padding-top:10px;
    font:600 7.5px/1.5 "Consolas",ui-monospace,monospace;
    letter-spacing:.10em;text-transform:uppercase;opacity:.6;
    border-top:1px solid currentColor;
  }

  /* A diagonal band across the corner for anything not simply "on now". */
  .band{
    position:absolute;z-index:4;top:16px;right:-30px;width:116px;
    transform:rotate(41deg);
    background:var(--accent);color:var(--paper);
    text-align:center;padding:3px 0;
    font:700 7px/1.3 "Segoe UI",sans-serif;letter-spacing:.08em;text-transform:uppercase;
    white-space:nowrap;
    box-shadow:0 1px 4px rgba(0,0,0,.35);
  }

  /* Feature presentation gets a bigger sheet, as it would in a real lobby. */
  .sec-feature .grid{grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}
  .sec-feature .ptitle{font-size:clamp(22px,2.7vw,33px)}
  .sec-feature .ptag{font-size:11.5px;-webkit-line-clamp:6}

  /* Not playable: still shown, never hidden — that is the whole thesis. It is
     just visibly not on. Behind glass, unlit, and not clickable. */
  .card.inert{
    cursor:default;filter:grayscale(.85) brightness(.6) contrast(.9);
    box-shadow:0 2px 0 rgba(0,0,0,.4);
  }
  .card.inert:hover{transform:none;box-shadow:0 2px 0 rgba(0,0,0,.4)}
  .card.inert .why{font-size:10px;line-height:1.4;opacity:.9}

  /* --- a work printing its own sheet ---------------------------------- */
  /* A declared poster overrides the derived palette by setting the same three
     custom properties inline, so the whole rest of the poster CSS is unaware
     that anything special happened. The vocabulary is closed and validated in
     derive.js — nothing unvalidated reaches this file. */
  .card.themed::before{opacity:.45}
  /* House programme sheets are old and foxed. A studio-supplied one-sheet is
     freshly printed, so it gets a gloss instead of a stain. */
  .card.themed::after{
    background:linear-gradient(115deg, rgba(255,255,255,.10), transparent 42%);
  }
  .card.themed .pfoot{opacity:.72}

  .face-condensed .ptitle{letter-spacing:-.02em;transform:scaleX(.93);transform-origin:left top}
  .face-slab .ptitle{font-family:Georgia,"Times New Roman",serif;letter-spacing:.005em}
  .face-slab .pmark{font-family:Georgia,serif}
  .face-hand .ptitle{
    font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive;
    text-transform:none;letter-spacing:0;font-weight:700;
  }
  .face-hand .pmark{font-family:"Segoe Print","Comic Sans MS",cursive}
  .face-mono .ptitle{font-family:Consolas,ui-monospace,monospace;letter-spacing:.01em;font-weight:700}
  .face-mono .pmark{font-family:Consolas,monospace}
  .face-neon .ptitle{text-shadow:0 0 7px currentColor,0 0 20px var(--accent)}
  .face-neon .pmark{opacity:.26;text-shadow:0 0 18px var(--accent)}

  /* ===== HOUSE RECORDS (the drift readout) ============================ */
  details.drift{margin-top:44px;border-top:1px solid var(--line);padding-top:16px}
  details.drift summary{
    cursor:pointer;color:var(--text-faint);font-size:10px;
    letter-spacing:.26em;text-transform:uppercase;font-weight:700;
  }
  details.drift summary:hover{color:var(--bulb)}
  details.drift .body{
    margin-top:14px;color:var(--text-dim);font-size:12px;
    font-family:Consolas,ui-monospace,monospace;line-height:1.75;white-space:pre-wrap;
    background:#0d0b13;border:1px solid var(--line);border-radius:2px;padding:14px 16px;
    overflow-x:auto;
  }

  .empty{color:var(--text-faint);padding:34px 0;font-size:13px}
  .empty pre{background:#0d0b13;border:1px solid var(--line);padding:10px 12px;border-radius:2px}

  /* ===== THE AUDITORIUM =============================================== */
  /* The bar OVERLAYS the frame and must not take height from it. Ultra Pong
     sets body{height:100%} with flex centring; shrink the viewport by the bar
     height and centred content taller than the box overflows in BOTH
     directions, putting the work's own header permanently out of reach with
     no way to scroll to it. Every page that centres on a full-height body has
     that shape, so the work gets the whole viewport. */
  #stage{position:fixed;inset:0;background:#000;z-index:50;display:none}
  #stage.on{display:block}
  #frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
  #bar{
    position:absolute;top:0;left:0;z-index:5;height:var(--bezel);max-width:96vw;
    display:flex;align-items:center;gap:14px;padding:0 12px;
    background:linear-gradient(180deg,rgba(24,20,32,.97),rgba(14,11,19,.93));
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:0 0 5px 0;transition:opacity .3s ease;
  }
  /* It folds and dims rather than hiding. Once a work has focus this page
     stops receiving mousemove at all — the cross-origin iframe swallows it —
     so a bar that vanished could never be summoned back by moving the mouse
     toward it. It stays physically present, just quiet enough to ignore. */
  #bar.slim{opacity:.26}
  #bar:hover{opacity:1}
  #bar .fold{
    display:flex;align-items:center;gap:14px;overflow:hidden;white-space:nowrap;
    max-width:75vw;opacity:1;transition:max-width .3s ease,opacity .2s ease;
  }
  #bar.slim .fold{max-width:0;opacity:0}
  #bar:hover .fold{max-width:75vw;opacity:1}
  #back{
    background:#0d0b13;border:1px solid var(--line);color:var(--text);
    padding:6px 13px;border-radius:2px;cursor:pointer;font:inherit;font-size:13px;flex:0 0 auto;
  }
  #back:hover{border-color:var(--bulb);color:var(--bulb)}
  #playing{font-size:13px;letter-spacing:.05em}
  #playing b{color:var(--bulb);font-weight:600}
  #barnote{color:var(--text-faint);font-size:11px}

  @media (max-width:640px){
    :root{--card-w:150px}
    .sec-feature .grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
  }
</style>
</head>
<body>

<header>
  <div class="sign">
    <div class="bulbs" id="bulbsTop"></div>
    <div class="housename">MARQUEE</div>
    <div class="bulbs" id="bulbsBot"></div>
    <div class="board" id="board"></div>
  </div>
  <div class="doors" id="doors"></div>
  <div class="boxoffice">
    <input id="q" type="search" placeholder="Filter — press / to jump here" autocomplete="off" spellcheck="false">
    <span class="count" id="count"></span>
    <span class="count"><kbd>&larr;&rarr;</kbd> move &nbsp; <kbd>[</kbd><kbd>]</kbd> rooms &nbsp; <kbd>Enter</kbd> play &nbsp; <kbd>Esc</kbd> clear</span>
    <span class="count" id="tagline"></span>
  </div>
</header>

<main id="main"></main>

<div id="stage">
  <div id="bar">
    <button id="back" type="button">&larr; Lobby</button>
    <span class="fold">
      <span id="playing"></span>
      <span id="barnote">Esc won&rsquo;t work once the work has focus &mdash; use the button.</span>
    </span>
  </div>
  <iframe id="frame" title="now playing" allow="fullscreen; gamepad; autoplay"></iframe>
</div>

<script src="manifest.js"></script>
<script>
// The page body is a function rather than an IIFE so that boot can be delayed
// by exactly as long as it takes to ask the tree what is in it. Off the mains
// that is no time at all and this runs on the next line. See the prelude below.
function marqueeBoot() {
  'use strict';

  var M     = window.MARQUEE_MANIFEST || null;
  var main  = document.getElementById('main');
  var q     = document.getElementById('q');
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');
  var bar   = document.getElementById('bar');
  var board = document.getElementById('board');
  var slimT = null, idleT = null, idleN = 0;
  var doors = document.getElementById('doors');
  var here  = null;   // which room is open
  // Namespaced because every file:// page in the tree shares ONE localStorage
  // bucket under origin "null" — the exact collision the Electron step exists
  // to fix. Until then, a distinctive key is the whole defence.
  var ROOM_KEY = 'marquee:room';

  // ----- the sign ---------------------------------------------------------
  function bulbRow(el, n, dead) {
    for (var i = 0; i < n; i++) {
      var b = document.createElement('i');
      if (dead.indexOf(i) >= 0) b.className = 'dead';
      el.appendChild(b);
    }
  }
  bulbRow(document.getElementById('bulbsTop'), 34, [11]);
  bulbRow(document.getElementById('bulbsBot'), 34, [24]);

  // Individual plastic letters slotted into rails. A deterministic few sit
  // crooked, because every reader board anyone has ever walked past has at
  // least one letter someone put in at an angle on a ladder in the cold.
  function setBoard(text, dim) {
    board.innerHTML = '';
    board.className = 'board' + (dim ? ' dim' : '');
    var s = String(text || '').toUpperCase().slice(0, 66);
    for (var i = 0; i < s.length; i++) {
      var el = document.createElement('span');
      if (s[i] === ' ') { el.className = 'sp'; el.textContent = ' '; }
      else {
        el.textContent = s[i];
        if (i % 11 === 4) el.className = 'tilt';
        else if (i % 17 === 9) el.className = 'tilt2';
      }
      board.appendChild(el);
    }
  }

  if (!M) {
    setBoard('no manifest', true);
    main.innerHTML = '<div class="empty">' +
      '<p><b>manifest.js is missing.</b> Marquee keeps no list of works, so with no manifest ' +
      'there is genuinely nothing to show — that is the design working, not a failure.</p>' +
      '<p>Generate it:</p><pre>node tools/derive.js --write</pre></div>';
    return;
  }

  // ----- deriving a poster from a name ------------------------------------
  // A pure function of the folder name: same work, same poster, every run,
  // with nothing stored and no assets. Rule-based generation suits a formulaic
  // machine better than invented art would, and it keeps the house from
  // pretending to speak for any game's own look.
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h;
  }
  // Shift before taking the modulus. FNV-1a's LOW bits are badly biased on
  // short similar strings — measured across the real 38 folder names, the raw
  // `hash % 8` put 19 of them in one bucket and one in each of four others.
  // `hash >>> 3` spreads the same names 6,4,6,5,4,5,4,4. A palette picker that
  // paints half the lobby the same colour is not much of a palette picker.
  function inkFor(g)    { return 'ink' + ((hash(g.folder) >>> 3) % 8); }
  function variantFor(g){ return 'v' + ((hash(g.folder + '/' + g.wing) >>> 3) % 5); }

  var shown  = [];
  var cursor = 0;

  function reasonFor(g) {
    if (g.entryStatus === 'ambiguous')
      return g.candidates.length + ' candidate files and no declaration — Marquee will not ' +
             'guess. Add a marquee comment to this work’s CLAUDE.md.';
    if (g.entryStatus === 'declared-missing')
      return 'Its CLAUDE.md names "' + g.declared + '", which is not there.';
    if (g.declared === 'none') return 'Declared as having no playable build yet.';
    return 'No build yet.';
  }

  function describe(g) {
    // Premise, then state, then the page's own <title>. Not every collection's
    // catalog carries a description column — Space Stuff's is | Tool | State |
    // Built by | — and an empty sheet is worse than one carrying the next most
    // specific thing that is actually true.
    var t = g.premise || g.state || g.title || '';
    return t.replace(/\*\*|`|\[|\]\([^)]*\)/g, '');
  }

  function bandFor(g) {
    if (g.entryStatus !== 'ok')        return 'not showing';
    if (g.billing === 'preview')       return 'coming soon';
    if (g.authoredDefects === true)    return 'as intended';
    return null;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function card(g, live) {
    var c = document.createElement(live ? 'button' : 'div');
    // A declared FACE replaces the derived layout variant rather than layering
    // on top of it. Both govern the type, and leaving both on meant Prompt
    // Defense's declared mono face rendered in the variant's italic — a game's
    // own choice losing an argument with a hash. Colours are different: those
    // override cleanly, so the variant stays when only colours were declared.
    var faced = !!(g.poster && g.poster.face);
    c.className = 'card ' + inkFor(g) + (faced ? '' : ' ' + variantFor(g)) + (live ? '' : ' inert');

    // A work may print its own sheet. It overrides the derived palette by
    // setting the same three properties, so every other rule below is unaware
    // anything special happened. Values are validated in derive.js; a bad one
    // never reaches here, it reaches the drift readout instead.
    if (g.poster) {
      c.classList.add('themed');
      if (g.poster.paper)  c.style.setProperty('--paper',  g.poster.paper);
      if (g.poster.ink)    c.style.setProperty('--ink',    g.poster.ink);
      if (g.poster.accent) c.style.setProperty('--accent', g.poster.accent);
      if (g.poster.face)   c.classList.add('face-' + g.poster.face);
    }
    if (live) c.type = 'button';

    var band = bandFor(g);
    if (band) c.appendChild(el('div', 'band', band));

    var p = el('div', 'poster');

    var top = (M.wings.filter(function (w) { return w.id === g.wing; })[0] || {}).name || g.wing;
    p.appendChild(el('div', 'ptop', top));
    p.appendChild(el('div', 'ptitle', g.display));
    p.appendChild(el('div', 'prule'));
    p.appendChild(el('div', live ? 'ptag' : 'ptag why', live ? describe(g) : reasonFor(g)));

    var foot = [];
    if (live && g.bytes != null) foot.push(Math.round(g.bytes / 1024) + ' KB');
    if (g.credit) foot.push(g.credit.replace(/\*\*|`/g, ''));
    if (g.catalogStatus === 'uncatalogued') foot.push('uncatalogued');
    p.appendChild(el('div', 'pfoot', foot.join('  ·  ')));

    // A one-sheet is mostly image, and there is no image. Rather than leave
    // half a sheet of blank paper, the work's own initial is set enormous and
    // bled off the corner — a printer's device, derived like everything else.
    var mono = (g.display.match(/[A-Za-z0-9À-ɏ]/) || ['?'])[0].toUpperCase();
    c.appendChild(el('div', 'pmark', mono));

    c.appendChild(p);

    if (live) {
      c.title = g.folder + '/' + g.entry;
      c.addEventListener('click', function () { play(g); });
      var announce = function () { stopIdle(); setBoard(g.display); };
      c.addEventListener('mouseenter', announce);
      c.addEventListener('focus', announce);
      c.addEventListener('mouseleave', startIdle);
    }
    return c;
  }

  function section(title, items, live, cls) {
    if (!items.length) return null;
    var wrap = el('div', 'sec-wrap ' + (cls || ''));
    wrap.appendChild(el('h2', 'sec', title + '  (' + items.length + ')'));
    var grid = el('div', 'grid');
    items.forEach(function (item) { grid.appendChild(card(item, live)); });
    wrap.appendChild(grid);
    return wrap;
  }

  // ----- the doors --------------------------------------------------------
  function openRooms() {
    return M.wings.filter(function (w) {
      return !w.missing && M.entries.some(function (g) { return g.wing === w.id; });
    });
  }

  function setRoom(id, announce) {
    var rooms = openRooms();
    if (!rooms.some(function (w) { return w.id === id; })) id = (rooms[0] || {}).id;
    here = id;
    try { localStorage.setItem(ROOM_KEY, id); } catch (e) {}
    cursor = 0;
    render();
    if (announce) {
      var w = rooms.filter(function (r) { return r.id === id; })[0];
      if (w) { stopIdle(); setBoard(w.name || w.id); setTimeout(startIdle, 1600); }
    }
  }

  function stepRoom(d) {
    var rooms = openRooms();
    var i = rooms.map(function (w) { return w.id; }).indexOf(here);
    setRoom(rooms[(i + d + rooms.length) % rooms.length].id, true);
  }

  function drawDoors(searching) {
    doors.innerHTML = '';
    doors.className = 'doors' + (searching ? ' searching' : '');
    openRooms().forEach(function (w) {
      var open = M.entries.filter(function (g) {
        return g.wing === w.id && g.entryStatus === 'ok';
      }).length;
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'door' + (w.id === here ? ' here' : '');
      b.setAttribute('data-room', w.id);
      b.appendChild(el('b', null, w.name || w.id));
      b.appendChild(el('i', null, w.kind === 'resident' ? 'resident' : open + ' open'));
      b.addEventListener('click', function () { setRoom(w.id, true); });
      doors.appendChild(b);
    });
    if (searching) doors.appendChild(el('span', 'searchnote', 'searching the whole building'));
  }

  // ----- rendering --------------------------------------------------------
  function render() {
    var needle = q.value.trim().toLowerCase();
    main.innerHTML = '';
    shown = [];
    var totalLive = 0, totalDead = 0;

    // One room at a time — except while filtering, when the whole building is
    // searched. A directory search that only looks in the room you happen to
    // be standing in is a worse search than no rooms at all.
    var searching = !!needle;
    drawDoors(searching);

    M.wings.forEach(function (w) {
      if (!searching && w.id !== here) return;
      if (w.missing) {
        main.appendChild(el('div', 'roommissing',
          (w.name || w.id) + ' — root missing: ' + w.root));
        return;
      }

      var mine = M.entries.filter(function (g) { return g.wing === w.id && matches(g, needle); });
      if (!mine.length) return;

      var live = mine.filter(function (g) { return g.entryStatus === 'ok'; });
      var dead = mine.filter(function (g) { return g.entryStatus !== 'ok'; });
      totalLive += live.length; totalDead += dead.length;

      var room = el('section', 'room' + (w.primary ? ' primary' : ''));
      var head = el('div', 'roomname');
      head.appendChild(el('span', null, w.name || w.id));
      head.appendChild(el('i', null, w.kind === 'resident' ? 'resident' : live.length + ' open'));
      room.appendChild(head);

      // Billing shelves only in the primary room. Elsewhere they would be
      // three headings over two posters each, which is filing, not billing.
      var groups;
      if (w.primary) {
        var feat = live.filter(function (g) { return g.billing === 'feature'; });
        var prev = live.filter(function (g) { return g.billing === 'preview'; });
        var rest = live.filter(function (g) { return g.billing !== 'feature' && g.billing !== 'preview'; });
        shown = shown.concat(feat, rest, prev);
        groups = [['Feature presentation', feat, true, 'sec-feature'],
                  ['Also showing', rest, true, ''],
                  ['Sneak preview', prev, true, ''],
                  ['Not showing', dead, false, '']];
      } else {
        shown = shown.concat(live);
        groups = [['', live, true, ''], ['Not showing', dead, false, '']];
      }

      groups.forEach(function (row) {
        if (!row[1].length) return;
        if (!row[0]) {
          var grid = el('div', 'grid');
          row[1].forEach(function (item) { grid.appendChild(card(item, row[2])); });
          room.appendChild(grid);
          return;
        }
        var frag = section(row[0], row[1], row[2], row[3]);
        if (frag) room.appendChild(frag);
      });

      main.appendChild(room);
    });

    if (!totalLive && !totalDead) {
      main.appendChild(el('div', 'empty', 'Nothing matches "' + q.value + '".'));
    }
    if (cursor >= shown.length) cursor = Math.max(0, shown.length - 1);
    main.appendChild(driftBlock());

    document.getElementById('count').textContent =
      totalLive + ' open' + (needle ? ' of ' + M.entries.length : '') +
      (totalDead ? '  ·  ' + totalDead + ' not showing' : '');
    startIdle();
  }

  function matches(g, needle) {
    if (!needle) return true;
    return (g.display + ' ' + g.folder + ' ' + g.premise + ' ' + (g.title || '') + ' ' + g.wing)
      .toLowerCase().indexOf(needle) >= 0;
  }

  // ----- attract mode -----------------------------------------------------
  // An empty reader board is a closed cinema. With nothing hovered it works
  // through whatever is currently on the shelves.
  function startIdle() {
    clearInterval(idleT);
    // Whatever is on in the room you are standing in, not the whole building.
    var titles = shown.length ? shown : M.entries.filter(function (g) { return g.entryStatus === 'ok'; });
    if (!titles.length) { setBoard('nothing showing', true); return; }
    var tick = function () { setBoard(titles[idleN++ % titles.length].display, true); };
    tick();
    idleT = setInterval(tick, 3400);
  }
  function stopIdle() { clearInterval(idleT); }

  // The drift readout lives on the page, not only in the terminal report,
  // because surfacing this is the reason Marquee derives its list at all. A
  // launcher that silently omitted four folders would be the thing we were
  // trying not to build.
  function driftBlock() {
    var uncat = M.entries.filter(function (g) { return g.catalogStatus === 'uncatalogued'; });
    var nodoc = M.entries.filter(function (g) { return !g.hasDoc; });
    var amb   = M.entries.filter(function (g) { return g.entryStatus === 'ambiguous'; });
    var undec = M.entries.filter(function (g) { return g.authoredDefects === null; });
    var names = function (a) {
      return a.length ? a.map(function (g) { return g.wing + '/' + g.folder; }).join(', ') : '—';
    };

    var rows = [];
    M.wings.forEach(function (w) {
      (w.missingFolders || []).forEach(function (r) {
        rows.push('catalog row, no folder      ' + w.id + '/' + r.folder);
      });
      (w.anomalies || []).forEach(function (a) {
        rows.push('anomaly [' + a.kind + ']  ' + w.id + ': ' + a.detail);
      });
      if (w.missing) rows.push('ROOM ROOT MISSING           ' + w.id + ' — ' + w.root);
    });

    // Where this catalog came from, stated plainly. A page that derived live
    // and a page reading a manifest from three days ago look identical, and
    // the difference is exactly the kind of thing this project exists to
    // report rather than hide.
    function sourceLine() {
      var s = window.MARQUEE_SOURCE || { live: false, why: 'unknown' };
      if (s.live) {
        return 'derived live from the tree  (' + s.passes + ' passes, ' +
               s.requests + ' requests, ' + s.ms + ' ms)';
      }
      return 'generated manifest.js  —  ' + s.why +
             (s.why === 'on batteries' ? '' : '  [live derivation failed]');
    }

    var d = document.createElement('details');
    d.className = 'drift';
    var n = uncat.length + amb.length + rows.length;
    d.appendChild(el('summary', null, 'House records  —  ' + n + ' item' + (n === 1 ? '' : 's') + ' adrift'));
    d.appendChild(el('div', 'body', [
      'floor plan          ' + M.venue,
      'catalog source      ' + sourceLine(),
      'manifest generated  ' + M.generated,
      'rooms               ' + M.wings.map(function (w) { return w.id + '(' + (w.count || 0) + ')'; }).join('  '),
      '',
      'on disk, no catalog row     ' + names(uncat),
      'ambiguous entry point       ' + names(amb),
      'no CLAUDE.md                ' + names(nodoc),
    ].concat(rows).concat([
      'defect status undeclared    ' + undec.length + ' of ' + M.entries.length + '  (unknown, not "sincere")',
      '',
      'Not all of this is an error. Some folders are queued for a first pass,',
      'and one is an empty artifact of a rearrangement. Read it, do not act on',
      'it blindly.',
    ]).join('\n')));
    return d;
  }

  // ----- the auditorium ---------------------------------------------------
  function play(g) {
    frame.src = g.url;
    var p = document.getElementById('playing');
    p.innerHTML = 'Now playing — <b></b>';
    p.querySelector('b').textContent = g.display;
    stage.classList.add('on');
    document.body.style.overflow = 'hidden';
    stopIdle();
    setBoard(g.display);
    // Focus the frame element so the keyboard reaches the work without a click
    // first. contentWindow.focus() would be better and is unreachable across
    // the opaque origin — this is the available half.
    setTimeout(function () { try { frame.focus(); } catch (e) {} }, 60);
    // Shown in full long enough to be read, then folded to a quiet corner tab.
    clearTimeout(slimT);
    bar.classList.remove('slim');
    slimT = setTimeout(function () { bar.classList.add('slim'); }, 2800);
  }

  function stop() {
    stage.classList.remove('on');
    clearTimeout(slimT);
    bar.classList.remove('slim');
    // Blanking the src actually tears it down. Leaving it loaded keeps its
    // audio playing and its rAF loop burning behind the lobby.
    frame.src = 'about:blank';
    document.body.style.overflow = '';
    q.focus();
    startIdle();
  }
  document.getElementById('back').addEventListener('click', stop);

  // ----- keyboard ---------------------------------------------------------
  // Only ever heard while the lobby has focus. Once a work is running the
  // parent stops receiving keys entirely — a file:// origin boundary, not
  // something to work around, and the reason the bezel has a button.
  document.addEventListener('keydown', function (e) {
    if (stage.classList.contains('on')) {
      if (e.key === 'Escape') stop();
      return;
    }
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === 'Escape') { q.value = ''; render(); q.blur(); return; }
    // Bracket keys walk between rooms; the arrows are already spoken for by
    // the posters. Digits jump straight to a door.
    if (e.key === '[') { e.preventDefault(); stepRoom(-1); return; }
    if (e.key === ']') { e.preventDefault(); stepRoom(1);  return; }
    if (/^[1-9]$/.test(e.key) && document.activeElement !== q) {
      var rooms = openRooms(), n = Number(e.key) - 1;
      if (rooms[n]) { e.preventDefault(); setRoom(rooms[n].id, true); }
      return;
    }

    var cards = main.querySelectorAll('.card:not(.inert)');
    if (!cards.length) return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      // Column count is read off the live layout rather than assumed, so
      // up/down still behave on a narrow window.
      var perRow = Math.max(1, Math.round(cards[0].parentElement.clientWidth /
                                          (cards[0].getBoundingClientRect().width + 16)));
      var step = (e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowLeft') ? -1
               : (e.key === 'ArrowDown') ? perRow : -perRow;
      e.preventDefault();
      cursor = Math.max(0, Math.min(cards.length - 1, cursor + step));
      cards[cursor].focus();
      return;
    }
    if (e.key === 'Enter' && document.activeElement === q && shown.length) {
      e.preventDefault(); play(shown[0]);
    }
  });

  q.addEventListener('input', function () { cursor = 0; render(); });

  // ----- open the doors ---------------------------------------------------
  var openCount = M.entries.filter(function (g) { return g.entryStatus === 'ok'; }).length;
  document.getElementById('tagline').textContent =
    openCount + ' open across ' + M.wings.length + ' rooms  ·  no list kept, derived every build';
  var remembered = null;
  try { remembered = localStorage.getItem(ROOM_KEY); } catch (e) {}
  var first = openRooms().filter(function (w) { return w.primary; })[0] || openRooms()[0];
  here = remembered || (first || {}).id;
  setRoom(here, false);
  q.focus();
}
</script>

<!--
  THE PRELUDE — where the catalog comes from.

  On batteries (file://) this does nothing at all: manifest.js has already
  assigned window.MARQUEE_MANIFEST and the page boots on the next line, exactly
  as it did before any of this existed. That path is not allowed to regress.

  On the mains, the same derivation that tools/derive.js runs in the terminal is
  run here, over the live tree, and its result replaces the generated manifest.
  The stale-until-someone-remembers-to-run-node window closes.

  If anything at all goes wrong it falls back to the generated manifest AND SAYS
  SO on the page. A launcher that silently showed you a three-day-old catalog
  while looking freshly derived would be a worse failure than not trying.
-->
<!--
  The Mains shim by RELATIVE path, not /_mains/client.js. Both resolve on the
  mains, but only this one also resolves on batteries — from file:// the
  absolute form asks for file:///_mains/client.js and logs a network error on
  every open. Working from either power source is the whole contract the shim
  advertises, so this page had better include it the way it says to.
-->
<script src="../Mains/client/mains.js"></script>
<script src="tools/derive.js"></script>
<script src="tools/live.js"></script>
<script>
(function () {
  'use strict';

  var plugged = window.Mains && window.Mains.plugged && window.MarqueeLive;

  if (!plugged) {
    window.MARQUEE_SOURCE = { live: false, why: 'on batteries' };
    marqueeBoot();
    return;
  }

  var t0 = Date.now();
  window.MarqueeLive.derive().then(function (res) {
    res.manifest.generated = new Date().toISOString();
    window.MARQUEE_MANIFEST = res.manifest;
    window.MARQUEE_SOURCE = {
      live: true,
      passes: res.passes,
      requests: res.requests,
      ms: Date.now() - t0,
    };
  }).catch(function (e) {
    // Keep whatever manifest.js left behind, and record why this is not live.
    window.MARQUEE_SOURCE = { live: false, why: String(e && e.message || e) };
  }).then(function () {
    marqueeBoot();
  });
})();
</script>
</body>
</html>
