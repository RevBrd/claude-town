<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MARQUEE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  ==========================================================================
  MARQUEE — the launcher.

  Reads manifest.js (generated by tools/derive.js) and nothing else. This page
  holds NO list of games and must never grow one: the whole architecture is
  that the catalog is derived, and a hardcoded fallback here would be a second
  list quietly drifting behind the first.

  It is deliberately plain. Launcher and cabinet share all of the machinery
  and differ only in presentation, so the skin decision is made later, with
  the thing running. Everything below the CSS is the machinery.

  file:// constraints this page is built around, all verified rather than
  assumed (17 Aug 2026, headless Chrome):
    - iframes of file:// DO load from a file:// parent.
    - The parent CANNOT script into them (contentDocument is null; both sides
      are opaque origin "null"). Hence a visible Back button rather than an
      Escape key — once a game has focus, this page stops hearing the keyboard.
    - localStorage is NOT partitioned for the frame: an iframed game reads the
      same saves as a double-clicked one. Launching through Marquee does not
      orphan anyone's high scores.

  CTown-4 (Opus 5), 17 Aug 2026.
  ==========================================================================
-->
<style>
  /* --- tunables, kept together ---------------------------------------- */
  :root{
    --ink:#0b0a0d;
    --ink-2:#131117;
    --ink-3:#1c1a22;
    --line:#2a2733;
    --text:#e8e4dd;
    --text-dim:#9c9689;
    --text-faint:#6b6659;
    --bulb:#ffc964;
    --bulb-glow:#ff9b2f;
    --live:#7fd68a;
    --warn:#e0a33c;
    --dead:#7a5561;
    --card-w:250px;
    --bezel:46px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--ink);
    color:var(--text);
    font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
    overflow-y:scroll;
  }

  /* --- the sign -------------------------------------------------------- */
  header{
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--ink-2),var(--ink));
    padding:26px 28px 20px;
    position:relative;
  }
  .bulbs{display:flex;gap:9px;margin-bottom:14px}
  .bulbs i{
    width:7px;height:7px;border-radius:50%;
    background:var(--bulb);
    box-shadow:0 0 7px var(--bulb-glow),0 0 16px rgba(255,155,47,.35);
    animation:flicker 3.6s infinite steps(1);
  }
  /* One bulb is out. It is out on purpose; a marquee with every bulb lit
     is a rendering, not a sign. Leave it. */
  .bulbs i.dead{background:#3a3038;box-shadow:none;animation:none}
  @keyframes flicker{0%,92%{opacity:1}94%{opacity:.45}96%{opacity:1}98%{opacity:.7}}
  .bulbs i:nth-child(3n){animation-delay:1.1s}
  .bulbs i:nth-child(4n){animation-delay:2.3s}

  h1{
    margin:0;font-size:30px;letter-spacing:.42em;font-weight:600;
    text-indent:.42em;color:var(--text);
  }
  .tagline{color:var(--text-faint);font-size:12px;margin-top:6px;letter-spacing:.06em}

  .controls{display:flex;gap:14px;align-items:center;margin-top:18px;flex-wrap:wrap}
  #q{
    background:var(--ink-3);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:3px;width:270px;font:inherit;
  }
  #q:focus{outline:none;border-color:var(--bulb);box-shadow:0 0 0 3px rgba(255,201,100,.09)}
  .count{color:var(--text-faint);font-size:12px}

  /* --- the plates ------------------------------------------------------ */
  main{padding:24px 28px 60px}
  .grid{
    display:grid;gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));
  }
  .card{
    background:var(--ink-2);border:1px solid var(--line);border-radius:4px;
    padding:14px 15px;cursor:pointer;text-align:left;color:inherit;font:inherit;
    display:flex;flex-direction:column;gap:7px;min-height:132px;
    transition:border-color .13s,background .13s,transform .13s;
  }
  .card:hover,.card:focus-visible{
    border-color:var(--bulb);background:var(--ink-3);outline:none;transform:translateY(-2px);
  }
  .card .name{font-size:15px;font-weight:600;letter-spacing:.02em}
  .card .premise{
    color:var(--text-dim);font-size:12px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card .meta{
    margin-top:auto;color:var(--text-faint);font-size:11px;
    display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  }
  .tag{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:var(--text-faint);
  }
  .tag.defects{border-color:var(--warn);color:var(--warn)}
  .tag.uncat{border-color:var(--dead);color:var(--dead)}

  /* Unplayable entries are shown, never hidden — that is the whole thesis.
     They are just visibly not launchable. */
  .card.inert{cursor:default;opacity:.5}
  .card.inert:hover{border-color:var(--line);background:var(--ink-2);transform:none}
  .card .why{color:var(--warn);font-size:11.5px}

  h2.sec{
    font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:var(--text-faint);
    margin:34px 0 13px;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:7px;
  }
  h2.sec:first-child{margin-top:0}

  /* --- rooms ----------------------------------------------------------- */
  /* Marquee is a building. Each wing of the venue is a room, and the primary
     one (the games) is the only room that gets billing shelves — elsewhere
     three headings over two cards each would be filing, not billing. */
  .room{margin-bottom:46px}
  .roomname{
    display:flex;align-items:baseline;gap:12px;
    font-size:19px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
    color:var(--text);padding-bottom:10px;margin-bottom:18px;
    border-bottom:1px solid var(--line);
  }
  .roomname i{font-style:normal;font-size:11px;letter-spacing:.12em;color:var(--text-faint)}
  .room.primary .roomname{color:var(--bulb)}
  .room:not(.primary) .roomname{font-size:15px;letter-spacing:.2em;color:var(--text-dim)}
  .roommissing{
    border:1px solid var(--warn);border-radius:4px;padding:12px 14px;
    color:var(--warn);font-size:12.5px;margin-bottom:24px;
  }

  /* --- drift readout --------------------------------------------------- */
  details.drift{margin-top:38px;border-top:1px solid var(--line);padding-top:14px}
  details.drift summary{
    cursor:pointer;color:var(--text-faint);font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;
  }
  details.drift .body{
    margin-top:12px;color:var(--text-dim);font-size:12px;
    font-family:Consolas,ui-monospace,monospace;line-height:1.75;white-space:pre-wrap;
  }

  /* --- the bezel ------------------------------------------------------- */
  /* The bar OVERLAYS the frame and must not take height from it.
     Ultra Pong sets body{height:100%} with flex centring. Shrink the viewport
     by the bar height and centred content taller than the box overflows in
     BOTH directions, putting the game’s own header permanently out of reach —
     you cannot scroll to it. Every game that centres on a full-height body has
     that shape, so the game gets the whole viewport and the bar floats over it. */
  #stage{position:fixed;inset:0;background:var(--ink);z-index:50;display:none}
  #stage.on{display:block}
  #frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;display:block}
  #bar{
    position:absolute;top:0;left:0;z-index:5;height:var(--bezel);max-width:96vw;
    display:flex;align-items:center;gap:14px;padding:0 12px;
    background:linear-gradient(180deg,rgba(28,26,34,.97),rgba(19,17,23,.93));
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    border-radius:0 0 5px 0;transition:opacity .3s ease;
  }
  /* It folds and dims rather than hiding. Once a game has focus this page stops
     receiving mousemove at all — the cross-origin iframe swallows it — so a bar
     that vanished could never be summoned back by moving the mouse. It has to
     stay physically present, just quiet enough to ignore. */
  #bar.slim{opacity:.26}
  #bar:hover{opacity:1}
  #bar .fold{
    display:flex;align-items:center;gap:14px;overflow:hidden;white-space:nowrap;
    max-width:75vw;opacity:1;transition:max-width .3s ease,opacity .2s ease;
  }
  #bar.slim .fold{max-width:0;opacity:0}
  #bar:hover .fold{max-width:75vw;opacity:1}
  #back{
    background:var(--ink);border:1px solid var(--line);color:var(--text);
    padding:6px 13px;border-radius:3px;cursor:pointer;font:inherit;font-size:13px;flex:0 0 auto;
  }
  #back:hover{border-color:var(--bulb);color:var(--bulb)}
  #playing{font-size:13px;letter-spacing:.05em}
  #playing b{color:var(--bulb);font-weight:600}
  #barnote{color:var(--text-faint);font-size:11px}

  .empty{color:var(--text-faint);padding:30px 0;font-size:13px}
  kbd{
    background:var(--ink-3);border:1px solid var(--line);border-radius:3px;
    padding:1px 5px;font:11px Consolas,monospace;color:var(--text-dim);
  }
</style>
</head>
<body>

<header>
  <div class="bulbs" id="bulbs"></div>
  <h1>MARQUEE</h1>
  <div class="tagline" id="tagline">reading the manifest&hellip;</div>
  <div class="controls">
    <input id="q" type="search" placeholder="Filter — press / to jump here" autocomplete="off" spellcheck="false">
    <span class="count" id="count"></span>
    <span class="count">&nbsp;&nbsp;<kbd>&larr;&rarr;</kbd> move &nbsp; <kbd>Enter</kbd> play &nbsp; <kbd>Esc</kbd> clear</span>
  </div>
</header>

<main id="main"><div class="empty">Loading&hellip;</div></main>

<div id="stage">
  <div id="bar">
    <button id="back" type="button">&larr; Marquee</button>
    <span class="fold">
      <span id="playing"></span>
      <span id="barnote">Esc won’t work once the game has focus — use the button.</span>
    </span>
  </div>
  <iframe id="frame" title="game" allow="fullscreen; gamepad; autoplay"></iframe>
</div>

<script src="manifest.js"></script>
<script>
(function () {
  'use strict';

  var M     = window.MARQUEE_MANIFEST || null;
  var main  = document.getElementById('main');
  var q     = document.getElementById('q');
  var stage = document.getElementById('stage');
  var frame = document.getElementById('frame');
  var bar   = document.getElementById('bar');
  var slimT = null;

  // ----- the sign's bulbs -------------------------------------------------
  var bulbs = document.getElementById('bulbs');
  for (var b = 0; b < 22; b++) {
    var el = document.createElement('i');
    if (b === 14) el.className = 'dead';
    bulbs.appendChild(el);
  }

  if (!M) {
    document.getElementById('tagline').textContent = 'no manifest';
    main.innerHTML = '<div class="empty">' +
      '<p><b>manifest.js is missing.</b> Marquee keeps no list of works, so with no manifest ' +
      'there is genuinely nothing to show — that is the design working, not a failure.</p>' +
      '<p>Generate it:</p><pre>node tools/derive.js --write</pre></div>';
    return;
  }

  // Entry URLs are built by derive.js, not here. These folder names contain
  // spaces, an apostrophe, four exclamation marks and an AE ligature, and one
  // encoder a mutation test can reach beats the same logic reimplemented in a
  // script tag where it cannot be tested at all.
  var shown  = [];
  var cursor = 0;

  function reasonFor(g) {
    if (g.entryStatus === 'ambiguous')
      return g.candidates.length + ' candidate files and no declaration — Marquee will not guess. ' +
             'Add a marquee comment to this work’s CLAUDE.md.';
    if (g.entryStatus === 'declared-missing')
      return 'Its CLAUDE.md names "' + g.declared + '", which is not there.';
    if (g.declared === 'none') return 'Declared as having no playable build yet.';
    return 'No build yet.';
  }

  function describe(g) {
    // Premise, then state, then the page's own <title>. Not every collection's
    // catalog has a description column — Space Stuff's is | Tool | State |
    // Built by | — and an empty plate is worse than one carrying the next
    // most specific thing that is actually true.
    var t = g.premise || g.state || g.title || '';
    return t.replace(/\*\*|`|\[|\]\([^)]*\)/g, '');
  }

  function matches(g, needle) {
    if (!needle) return true;
    return (g.display + ' ' + g.folder + ' ' + g.premise + ' ' + (g.title || '') + ' ' + g.wing)
      .toLowerCase().indexOf(needle) >= 0;
  }

  function tag(text, cls) {
    var s = document.createElement('span');
    s.className = 'tag' + (cls ? ' ' + cls : '');
    s.textContent = text;
    return s;
  }

  function card(g, live) {
    var el = document.createElement(live ? 'button' : 'div');
    el.className = 'card' + (live ? '' : ' inert');
    if (live) el.type = 'button';

    var name = document.createElement('div');
    name.className = 'name';
    name.textContent = g.display;
    el.appendChild(name);

    if (live) {
      var p = document.createElement('div');
      p.className = 'premise';
      p.textContent = describe(g);
      el.appendChild(p);
    } else {
      var w = document.createElement('div');
      w.className = 'why';
      w.textContent = reasonFor(g);
      el.appendChild(w);
    }

    var meta = document.createElement('div');
    meta.className = 'meta';
    if (live && g.bytes != null) meta.appendChild(tag(Math.round(g.bytes / 1024) + ' KB'));
    if (g.authoredDefects === true) meta.appendChild(tag('authored defects', 'defects'));
    if (g.catalogStatus === 'uncatalogued') meta.appendChild(tag('uncatalogued', 'uncat'));
    el.appendChild(meta);

    if (live) {
      el.title = g.folder + '/' + g.entry;
      el.addEventListener('click', function () { play(g); });
    }
    return el;
  }

  function section(title, items, live) {
    if (!items.length) return null;
    var h = document.createElement('h2');
    h.className = 'sec';
    h.textContent = title + '  (' + items.length + ')';
    var grid = document.createElement('div');
    grid.className = 'grid';
    items.forEach(function (item) { grid.appendChild(card(item, live)); });
    var frag = document.createDocumentFragment();
    frag.appendChild(h);
    frag.appendChild(grid);
    return frag;
  }

  // ----- rendering --------------------------------------------------------
  function render() {
    var needle = q.value.trim().toLowerCase();
    main.innerHTML = '';
    shown = [];
    var totalLive = 0, totalDead = 0;

    M.wings.forEach(function (w) {
      if (w.missing) {
        var warn = document.createElement('div');
        warn.className = 'roommissing';
        warn.textContent = (w.name || w.id) + ' — root missing: ' + w.root;
        main.appendChild(warn);
        return;
      }

      var mine = M.entries.filter(function (g) { return g.wing === w.id && matches(g, needle); });
      if (!mine.length) return;

      var live = mine.filter(function (g) { return g.entryStatus === 'ok'; });
      var dead = mine.filter(function (g) { return g.entryStatus !== 'ok'; });
      totalLive += live.length; totalDead += dead.length;

      var room = document.createElement('section');
      room.className = 'room' + (w.primary ? ' primary' : '');
      var head = document.createElement('div');
      head.className = 'roomname';
      head.innerHTML = '<span></span><i>' + (w.kind === 'resident' ? 'resident' : live.length + ' open') + '</i>';
      head.querySelector('span').textContent = w.name || w.id;
      room.appendChild(head);

      // Billing shelves only in the primary wing. Elsewhere they would be
      // three headings over two cards each, which is filing, not billing.
      var groups;
      if (w.primary) {
        var feat = live.filter(function (g) { return g.billing === 'feature'; });
        var prev = live.filter(function (g) { return g.billing === 'preview'; });
        var rest = live.filter(function (g) { return g.billing !== 'feature' && g.billing !== 'preview'; });
        shown = shown.concat(feat, rest, prev);
        groups = [['Feature presentation', feat, true],
                  ['Now showing', rest, true],
                  ['Sneak preview', prev, true],
                  ['Not playable', dead, false]];
      } else {
        shown = shown.concat(live);
        groups = [['', live, true], ['Not playable', dead, false]];
      }

      groups.forEach(function (row) {
        if (!row[1].length) return;
        if (!row[0]) {
          var grid = document.createElement('div');
          grid.className = 'grid';
          row[1].forEach(function (item) { grid.appendChild(card(item, row[2])); });
          room.appendChild(grid);
          return;
        }
        var frag = section(row[0], row[1], row[2]);
        if (frag) room.appendChild(frag);
      });

      main.appendChild(room);
    });

    if (!totalLive && !totalDead) {
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'Nothing matches "' + q.value + '".';
      main.appendChild(e);
    }
    if (cursor >= shown.length) cursor = Math.max(0, shown.length - 1);
    main.appendChild(driftBlock());

    document.getElementById('count').textContent =
      totalLive + ' open' + (needle ? ' of ' + M.entries.length : '') +
      (totalDead ? '  ·  ' + totalDead + ' not playable' : '');
  }

  // The drift readout lives on the page, not only in the terminal report,
  // because surfacing this is the reason Marquee derives its list at all. A
  // launcher that silently omitted four folders would be the thing we were
  // trying not to build.
  function driftBlock() {
    var uncat = M.entries.filter(function (g) { return g.catalogStatus === 'uncatalogued'; });
    var nodoc = M.entries.filter(function (g) { return !g.hasDoc; });
    var amb   = M.entries.filter(function (g) { return g.entryStatus === 'ambiguous'; });
    var undec = M.entries.filter(function (g) { return g.authoredDefects === null; });
    var names = function (a) {
      return a.length ? a.map(function (g) { return g.wing + '/' + g.folder; }).join(', ') : '—';
    };

    var rows = [];
    M.wings.forEach(function (w) {
      (w.missingFolders || []).forEach(function (r) {
        rows.push('catalog row, no folder      ' + w.id + '/' + r.folder);
      });
      (w.anomalies || []).forEach(function (a) {
        rows.push('anomaly [' + a.kind + ']  ' + w.id + ': ' + a.detail);
      });
      if (w.missing) rows.push('WING ROOT MISSING           ' + w.id + ' — ' + w.root);
    });

    var d = document.createElement('details');
    d.className = 'drift';
    var s = document.createElement('summary');
    var n = uncat.length + amb.length + rows.length;
    s.textContent = 'Catalog drift  —  ' + n + ' item' + (n === 1 ? '' : 's');
    var body = document.createElement('div');
    body.className = 'body';
    body.textContent = [
      'floor plan          ' + M.venue,
      'manifest generated  ' + M.generated,
      'rooms               ' + M.wings.map(function (w) { return w.id + '(' + (w.count || 0) + ')'; }).join('  '),
      '',
      'on disk, no catalog row     ' + names(uncat),
      'ambiguous entry point       ' + names(amb),
      'no CLAUDE.md                ' + names(nodoc),
    ].concat(rows).concat([
      'defect status undeclared    ' + undec.length + ' of ' + M.entries.length + '  (unknown, not "sincere")',
      '',
      'Not all of this is an error. Some folders are queued for a first pass,',
      'and one is an empty artifact of a rearrangement. Read it, do not act on',
      'it blindly.',
    ]).join('\n');
    d.appendChild(s);
    d.appendChild(body);
    return d;
  }

  // ----- launching --------------------------------------------------------
  function play(g) {
    frame.src = g.url;
    var p = document.getElementById('playing');
    p.innerHTML = 'Now playing — <b></b>';
    p.querySelector('b').textContent = g.display;
    stage.classList.add('on');
    document.body.style.overflow = 'hidden';
    // Focus the frame element so the keyboard reaches the work without a click
    // first. contentWindow.focus() would be better and is unreachable across
    // the opaque origin — this is the available half.
    setTimeout(function () { try { frame.focus(); } catch (e) {} }, 60);
    // Shown in full long enough to be read, then folded to a quiet corner tab.
    clearTimeout(slimT);
    bar.classList.remove('slim');
    slimT = setTimeout(function () { bar.classList.add('slim'); }, 2800);
  }

  function stop() {
    stage.classList.remove('on');
    clearTimeout(slimT);
    bar.classList.remove('slim');
    // Blanking the src actually tears it down. Leaving it loaded keeps its
    // audio playing and its rAF loop burning behind the list.
    frame.src = 'about:blank';
    document.body.style.overflow = '';
    q.focus();
  }
  document.getElementById('back').addEventListener('click', stop);

  // ----- keyboard ---------------------------------------------------------
  // Only ever heard while the list has focus. Once a work is running the
  // parent stops receiving keys entirely — a file:// origin boundary, not
  // something to work around, and the reason the bezel has a button.
  document.addEventListener('keydown', function (e) {
    if (stage.classList.contains('on')) {
      if (e.key === 'Escape') stop();
      return;
    }
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); return; }
    if (e.key === 'Escape') { q.value = ''; render(); q.blur(); return; }

    var cards = main.querySelectorAll('.card:not(.inert)');
    if (!cards.length) return;

    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      // Column count is read off the live layout rather than assumed, so
      // up/down still behave on a narrow window.
      var perRow = Math.max(1, Math.round(cards[0].parentElement.clientWidth /
                                          (cards[0].getBoundingClientRect().width + 12)));
      var step = (e.key === 'ArrowRight') ? 1 : (e.key === 'ArrowLeft') ? -1
               : (e.key === 'ArrowDown') ? perRow : -perRow;
      e.preventDefault();
      cursor = Math.max(0, Math.min(cards.length - 1, cursor + step));
      cards[cursor].focus();
      return;
    }
    if (e.key === 'Enter' && document.activeElement === q && shown.length) {
      e.preventDefault(); play(shown[0]);
    }
  });

  q.addEventListener('input', function () { cursor = 0; render(); });

  // ----- go ---------------------------------------------------------------
  var openCount = M.entries.filter(function (g) { return g.entryStatus === 'ok'; }).length;
  document.getElementById('tagline').textContent =
    openCount + ' open across ' + M.wings.length + ' rooms  ·  no list kept, derived every build';
  render();
  q.focus();
})();
</script>
</body>
</html>
